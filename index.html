<!DOCTYPE html>
<html>
<head>
    <title>My Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>My Portfolio</h1>
    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#projects">Projects</a>
        <a href="#contact">Contact</a>
    </nav>
</header>

<section id="home">
    <h2>Welcome to My Portfolio</h2>
    <p>Hello! I am a Student Developer.</p>
</section>

<section id="about">
    <h2>About Me</h2>
    <p>I am studying Computer Science Engineering.</p>
</section>

<section id="projects">
    <h2>My Projects</h2>

    <div class="project-container">

        <div class="project">
            <h3>Project 1</h3>
            <p>Student Management System</p>
        </div>

        <div class="project">
            <h3>Project 2</h3>
            <p>Online Shopping Website</p>
        </div>

        <div class="project">
            <h3>Project 3</h3>
            <p>Personal Portfolio Website</p>
        </div>

    </div>
</section>

<section id="contact">
    <h2>Contact Me</h2>

    <form id="contactForm">
        <input type="text" id="name" placeholder="Enter Name">
        <input type="email" id="email" placeholder="Enter Email">
        <button type="submit">Submit</button>
    </form>

    <p id="message"></p>
</section>

<script type="module" src="script.js"></script>
</body>
</html>
